services:
  hendy-render-worker:
    build:
      context: ./services/render-worker
      dockerfile: Dockerfile
    image: hendy-render-worker:latest
    restart: unless-stopped
    init: true
    environment:
      HENDY_API_URL: \${HENDY_API_URL:?Set HENDY_API_URL in .env.render}
      RENDER_SERVICE_TOKEN: \${RENDER_SERVICE_TOKEN:?Set RENDER_SERVICE_TOKEN in .env.render}
      RENDER_WORKER_ID: \${RENDER_WORKER_ID:-render-host-1}
      POLL_INTERVAL_MS: \${POLL_INTERVAL_MS:-2000}
      JOB_TIMEOUT_MS: \${JOB_TIMEOUT_MS:-2700000}
      MAX_INPUT_BYTES: \${MAX_INPUT_BYTES:-262144000}
      MAX_OUTPUT_BYTES: \${MAX_OUTPUT_BYTES:-83886080}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
