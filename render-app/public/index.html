<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hendy Video Studio</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header>HENDY <b>STUDIO</b><small id="health">Đang kết nối…</small></header><main><section class="hero"><p>VIDEO TOOLKIT · RENDER READY</p><h1>Biến video thô<br><span>thành bản hoàn thiện.</span></h1><p>Tải lên · Cắt video · Xuất MP4 H.264</p></section><div class="grid"><form id="form" class="panel"><h2>01 / Video đầu vào</h2><label class="drop" for="video">＋ Chọn video hoặc kéo thả<input id="video" name="video" type="file" accept="video/*,.mkv" required><small id="filemeta">MP4 · MOV · WEBM · MKV</small></label><h2>02 / Thiết lập xuất</h2><label>Độ phân giải<select name="preset"><option value="720p">HD 720p</option><option value="1080p">Full HD 1080p</option><option value="vertical">Video dọc 9:16</option><option value="original">Kích thước gốc</option></select></label><div class="row"><label>Bắt đầu (giây)<input name="startSeconds" type="number" min="0" step=".1" placeholder="0"></label><label>Thời lượng (giây)<input name="durationSeconds" type="number" min=".1" step=".1" placeholder="Toàn bộ"></label></div><button id="submit">▶ Bắt đầu xử lý ↗</button><p id="error"></p></form><section class="panel"><h2>03 / Tiến trình xử lý</h2><div id="empty">Chưa có tác vụ. Tải video lên để bắt đầu.</div><div id="jobs"></div></section></div><footer>FFmpeg · MP4 · H.264 <span>HENDY STUDIO</span></footer></main></body></html>
