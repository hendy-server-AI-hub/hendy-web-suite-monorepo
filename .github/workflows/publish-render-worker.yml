name: Publish FFmpeg render worker image

on:
  push:
    branches: [main]
    paths:
      - "services/render-worker/**"
      - "docker-compose.render.yml"
      - ".github/workflows/publish-render-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: render-worker-image
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate worker JavaScript
        run: npm run render:check
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/render-worker
          file: services/render-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/hendy-server-ai-hub/hendy-web-suite-monorepo-render-worker:latest
            ghcr.io/hendy-server-ai-hub/hendy-web-suite-monorepo-render-worker:sha-${{ github.sha }}
