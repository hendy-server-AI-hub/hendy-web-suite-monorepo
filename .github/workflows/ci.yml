name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install
      - name: Check required repository structure
        run: npm run check:structure
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: API smoke tests
        run: npm run test:api
      - name: Validate FFmpeg render worker JavaScript
        run: npm run render:check
      - name: Build all apps and Worker
        run: npm run build
