name: Deploy Hendy API Worker

on:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-api-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify API source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check:syntax
      - run: npm test

  deploy:
    name: Migrate and deploy Worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.AUTH_JWT_SECRET != '' && secrets.BOOTSTRAP_ADMIN_KEY != '' && secrets.RENDER_SERVICE_TOKEN != '' && vars.VITE_API_BASE_URL != '' && vars.VITE_ADMIN_URL != '' && vars.VITE_STUDIO_URL != '' && vars.VITE_SITE_URL != '' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
      VITE_STUDIO_URL: ${{ vars.VITE_STUDIO_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Production configuration preflight
        if: ${{ env.CAN_DEPLOY == 'true' }}
        run: npm run check:production-config
      - name: Apply D1 migrations
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply hendy-control-db --remote --yes --config apps/api/wrangler.toml
      - name: Deploy Worker
        if: ${{ env.CAN_DEPLOY == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
      - name: Set Worker runtime secrets
        if: ${{ env.CAN_DEPLOY == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          BOOTSTRAP_ADMIN_KEY: ${{ secrets.BOOTSTRAP_ADMIN_KEY }}
          RENDER_SERVICE_TOKEN: ${{ secrets.RENDER_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$AUTH_JWT_SECRET" | npx --yes wrangler@4 secret put AUTH_JWT_SECRET --config apps/api/wrangler.toml
          printf '%s' "$BOOTSTRAP_ADMIN_KEY" | npx --yes wrangler@4 secret put BOOTSTRAP_ADMIN_KEY --config apps/api/wrangler.toml
          printf '%s' "$RENDER_SERVICE_TOKEN" | npx --yes wrangler@4 secret put RENDER_SERVICE_TOKEN --config apps/api/wrangler.toml
      - name: Deployment skipped until provider setup
        if: ${{ env.CAN_DEPLOY != 'true' }}
        run: echo "::warning::Source verification succeeded, but production deploy was skipped because Cloudflare credentials or public URL variables are missing."
