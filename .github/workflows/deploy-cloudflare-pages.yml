name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-web/**"
      - "apps/studio-web/**"
      - "apps/site/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "apps/api/wrangler.toml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy Admin, Studio and Site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.VITE_API_BASE_URL != '' && vars.VITE_ADMIN_URL != '' && vars.VITE_STUDIO_URL != '' && vars.VITE_SITE_URL != '' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
      VITE_STUDIO_URL: ${{ vars.VITE_STUDIO_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build Admin
        run: npm run build:admin
      - name: Build Studio
        run: npm run build:studio
      - name: Build Site
        run: npm run build:site
      - name: Deploy Admin Pages
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/admin-web/dist --project-name hendy-admin-web --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"
      - name: Deploy Studio Pages
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/studio-web/dist --project-name hendy-studio-web --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"
      - name: Deploy public Site Pages
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/site/dist --project-name hendy-public-site --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"
      - name: Explain skipped deployment
        if: ${{ env.CAN_DEPLOY != 'true' }}
        run: echo "::warning::Pages build succeeded but deployment was skipped. Run npm run bootstrap:production:push to provision Pages projects, secrets and required frontend URL variables."
