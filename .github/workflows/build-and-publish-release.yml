name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build web apps and package release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build admin, studio, site and API
        run: npm run build
      - name: Assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle/admin-web release-bundle/studio-web release-bundle/site release-bundle/api
          cp -R apps/admin-web/dist/. release-bundle/admin-web/
          cp -R apps/studio-web/dist/. release-bundle/studio-web/
          cp -R apps/site/dist/. release-bundle/site/
          cp apps/api/wrangler.toml release-bundle/api/
          mkdir -p release-bundle/render-worker release-bundle/docs
          cp -R services/render-worker/. release-bundle/render-worker/
          cp docker-compose.render.yml .env.render.example release-bundle/
          cp docs/PRODUCTION_BOOTSTRAP.md release-bundle/docs/
          cp README.md release-bundle/README-monorepo.md
          printf 'Hendy Web Suite release: %s\n' "$GITHUB_REF_NAME" > release-bundle/VERSION.txt
          cd release-bundle
          zip -qr "../hendy-web-suite-${GITHUB_REF_NAME}.zip" .
      - name: Upload CI artifact
        uses: actions/upload-artifact@v5
        with:
          name: hendy-web-suite-${{ github.ref_name }}
          path: hendy-web-suite-${{ github.ref_name }}.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hendy Web Suite ${{ github.ref_name }}
          generate_release_notes: true
          files: hendy-web-suite-${{ github.ref_name }}.zip
