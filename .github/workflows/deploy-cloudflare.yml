name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate and deploy API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.AUTH_JWT_SECRET != '' && secrets.BOOTSTRAP_ADMIN_KEY != '' && secrets.RENDER_SERVICE_TOKEN != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Worker bundle
        run: npm run build:api
      - name: Deploy Worker to Cloudflare
        if: ${{ env.CAN_DEPLOY == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
      - name: Configure Worker authentication secrets
        if: ${{ env.CAN_DEPLOY == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          BOOTSTRAP_ADMIN_KEY: ${{ secrets.BOOTSTRAP_ADMIN_KEY }}
          RENDER_SERVICE_TOKEN: ${{ secrets.RENDER_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$AUTH_JWT_SECRET" | npx wrangler secret put AUTH_JWT_SECRET --config apps/api/wrangler.toml
          printf '%s' "$BOOTSTRAP_ADMIN_KEY" | npx wrangler secret put BOOTSTRAP_ADMIN_KEY --config apps/api/wrangler.toml
          printf '%s' "$RENDER_SERVICE_TOKEN" | npx wrangler secret put RENDER_SERVICE_TOKEN --config apps/api/wrangler.toml
      - name: Explain skipped deployment
        if: ${{ env.CAN_DEPLOY != 'true' }}
        run: echo "::warning::Cloudflare deploy skipped. Run npm run bootstrap:production locally to provision resources and configure all required GitHub Actions secrets."
