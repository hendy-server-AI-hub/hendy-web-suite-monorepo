name: Deploy Hendy Static Apps

on:
  push:
    branches: ["main"]
    paths:
      - "apps/admin-web/**"
      - "apps/studio-web/**"
      - "apps/site/**"
      - "scripts/render-pages-config.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish Admin, Studio and Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.VITE_API_BASE_URL != '' && vars.VITE_ADMIN_URL != '' && vars.VITE_STUDIO_URL != '' && vars.VITE_SITE_URL != '' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
      VITE_STUDIO_URL: ${{ vars.VITE_STUDIO_URL }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify code
        run: npm run check
      - name: Generate Admin runtime config
        if: ${{ env.CAN_DEPLOY == 'true' }}
        run: node scripts/render-pages-config.mjs admin-web
      - name: Generate Studio runtime config
        if: ${{ env.CAN_DEPLOY == 'true' }}
        run: node scripts/render-pages-config.mjs studio-web
      - name: Generate Site runtime config
        if: ${{ env.CAN_DEPLOY == 'true' }}
        run: node scripts/render-pages-config.mjs site
      - name: Deploy Admin Pages
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/admin-web --project-name hendy-admin-web --branch main
      - name: Deploy Studio Pages
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/studio-web --project-name hendy-studio-web --branch main
      - name: Deploy public Site
        if: ${{ env.CAN_DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/site --project-name hendy-public-site --branch main
      - name: Explain skipped Pages deploy
        if: ${{ env.CAN_DEPLOY != 'true' }}
        run: echo "::warning::Static apps were verified, but Pages deploy requires Cloudflare credentials and all four VITE URL variables."
